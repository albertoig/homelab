name: Renovate

# Self-hosted Renovate (issue #40). The Mend-hosted Renovate app is not installed
# on this repo, so we run the same engine ourselves on a schedule. It reuses the
# existing renovate.json unchanged and opens dependency PRs against `beta`.
#
# Runs under a dedicated GitHub App bot (renovate-homelab[bot]). The workflow mints
# a short-lived installation token from two repository secrets:
#   RENOVATE_BOT_ID          — the GitHub App's App ID
#   RENOVATE_BOT_PRIVATE_KEY — the full .pem private key contents
# With RENOVATE_PLATFORM_COMMIT enabled, Renovate commits through the GitHub API, so
# GitHub auto-signs the commits ("Verified") with no GPG keys to manage. The default
# GITHUB_TOKEN is intentionally NOT used: PRs it opens cannot trigger the validate
# workflow, and it cannot manage the Dependency Dashboard issue.

on:
  schedule:
    # Wake Renovate hourly on weekdays (UTC). Whether it actually opens PRs is
    # gated by renovate.json's own `schedule`/`timezone`, so this only controls
    # how often it checks — not when PRs land.
    - cron: "0 * * * 1-5"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        default: info
        options:
          - debug
          - info
          - warn
      dryRun:
        description: Dry run (compute updates but write no branches or PRs)
        type: boolean
        default: false

concurrency:
  # Never let two Renovate runs overlap on the same repo.
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate Renovate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RENOVATE_BOT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: renovate.json
          token: ${{ steps.bot-token.outputs.token }}
        env:
          # Restrict to this repo (no org-wide autodiscovery).
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commit via the GitHub API so commits are auto-signed → "Verified".
          # The App bot is the (signing) committer; the author is pinned below so
          # commits are attributed to the dependency-bot-ai account.
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_GIT_AUTHOR: "dependency-bot-ai <302342843+dependency-bot-ai@users.noreply.github.com>"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Empty string on scheduled runs = live; "full" only on a manual dry run.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
